# Website project: the landing page, resources and examples/*.ipynb are HTML
# pages; each lecture in slides/ is a talk-revealjs deck (see
# slides/_metadata.yml). Quarto's book type cannot render revealjs chapters,
# which is why this is a website. Notebooks render with their stored outputs
# (Quarto does not execute .ipynb files by default).
project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - resources.qmd
    - setup/*.qmd
    - slides/*.qmd
    - examples/*.ipynb

website:
  title: "Virtual Icechunk"
  site-url: https://ocean-icechunks.github.io/2026-ioos-hackathon
  repo-url: https://github.com/ocean-icechunks/2026-ioos-hackathon
  repo-actions: [source, issue]
  page-navigation: true
  favicon: images/ioos-code-sprint-logo.png
  navbar:
    background: primary
    search: true
    right:
      - icon: github
        href: https://github.com/ocean-icechunks/2026-ioos-hackathon
        text: "repo"
  # Chapter list on the left, docked like NMFSHackDays-2026.
  sidebar:
    - id: home
      logo: images/ioos-code-sprint-logo.png
      logo-alt: "IOOS Code Sprint logo"
      style: docked
      collapse-level: 1
      pinned: true
      align: left
      contents:
        - href: index.qmd
          text: Home
        - section: JupyterHub Skills
          contents:
            - href: setup/01-jupyterhub.qmd
              text: "Log in to the JupyterHub"
            - href: setup/02-jupyterlab.qmd
              text: "Find your way around JupyterLab"
            - href: setup/03-start-your-agent.qmd
              text: "Start your coding agent"
            - href: setup/04-git-with-agent.qmd
              text: "Git and GitHub, with an agent"
            - href: setup/05-scratch-bucket.qmd
              text: "The scratch bucket"
        - section: Lectures
          contents:
            - href: slides/01-why-virtual.qmd
              text: "1 · Why virtual Icechunk"
            - href: slides/02-agent-and-skills.qmd
              text: "2 · Working with an agent"
            - href: slides/03-pipeline.qmd
              text: "3 · The basic pipeline"
            - href: slides/04-audit.qmd
              text: "4 · Auditing your files"
            - href: slides/05-build.qmd
              text: "5 · Building a store"
            - href: slides/06-visualize.qmd
              text: "6 · Visualizing"
        - section: Examples
          contents:
            - href: examples/01-hycom-snow-crab.ipynb
              text: "1 · HYCOM: bottom temp in snow crab region"
            - href: examples/02-pacioos-aloha-profiles.ipynb
              text: "2 · PacIOOS: seasons and water masses at ALOHA"
            - href: examples/03-oa-saturation-horizon.ipynb
              text: "3 · OA indicators: aragonite saturation horizon"
        - text: "---"
        - href: resources.qmd
          text: Resources

format:
  html:
    theme: cosmo
    toc: true
