# Website project: the landing page and resources are HTML pages; each chapter
# in slides/ is a talk-revealjs deck (see slides/_metadata.yml). Quarto's book
# type cannot render revealjs chapters, which is why this is a website.
project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - resources.qmd
    - setup/*.qmd
    - slides/*.qmd

website:
  title: "Virtual Icechunk"
  site-url: https://ocean-icechunks.github.io/2026-ioos-hackathon
  repo-url: https://github.com/ocean-icechunks/2026-ioos-hackathon
  repo-actions: [source, issue]
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: JupyterHub Skills
        menu:
          - href: setup/01-jupyterhub.qmd
            text: "Log in to the JupyterHub"
          - href: setup/02-jupyterlab.qmd
            text: "Find your way around JupyterLab"
          - href: setup/03-scratch-bucket.qmd
            text: "The scratch bucket"
          - href: setup/04-git-with-agent.qmd
            text: "Git and GitHub, with an agent"
      - text: Chapters
        menu:
          - href: slides/01-why-virtual.qmd
            text: "1 · Why virtual Icechunk"
          - href: slides/02-quick-wins.qmd
            text: "2 · Quick wins"
          - href: slides/03-agent-and-skills.qmd
            text: "3 · Working with an agent"
          - href: slides/04-pipeline.qmd
            text: "4 · The basic pipeline"
          - href: slides/05-audit.qmd
            text: "5 · Auditing your files"
          - href: slides/06-build.qmd
            text: "6 · Building a store"
          - href: slides/07-visualize.qmd
            text: "7 · Visualizing"
      - href: resources.qmd
        text: Resources
    right:
      - icon: github
        href: https://github.com/ocean-icechunks/2026-ioos-hackathon

format:
  html:
    theme: cosmo
    toc: true
